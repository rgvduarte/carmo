# The analytics Worker (gocarmo-api), on its workers.dev address. Published by .github/workflows/deploy-stats.yml.
# Secrets (set by that workflow, never here): ADMIN_KEY (the admin password, shared with the Pedidos) and SALT_SECRET
# (made once by the workflow). See README.md.
name = "gocarmo-api"
main = "src/index.js"
compatibility_date = "2026-09-01"
workers_dev = true
preview_urls = false

# no request logs: IPs and user agents must never be written anywhere
[observability]
enabled = false

[vars]
SITE_ORIGIN = "https://gocarmo.com"
# where the data lives: "eu" keeps the Durable Object in the EU. Decide before the first deploy and never change it
# once there is data (README.md, «Problemas»).
STORE_JURISDICTION = "eu"
# page views rolled up per alarm run (keeps each run well inside the CPU limit of Workers Free)
ROLLUP_CHUNK = "40"

[[durable_objects.bindings]]
name = "STORE"
class_name = "Store"

# classic migrations only (never the `exports` form): tags apply in order and cannot be edited once deployed
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Store"]

# bursts, counted by Cloudflare in each location (no storage writes). namespace_id: any number, unique in the account
# (the Pedidos Worker uses 4101 and 4102).
[[ratelimits]]
name = "RL_BEACON"
namespace_id = "4201"
simple = { limit = 60, period = 60 }

[[ratelimits]]
name = "RL_ADMIN"
namespace_id = "4202"
simple = { limit = 120, period = 60 }
